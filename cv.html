	<script>
    // Theme icons: Tabler Icons sun-filled / moon-filled (MIT), as used by the al-folio theme
    const SUN_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 19a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z"/><path d="M18.313 16.91l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 1.218 -1.567l.102 .07z"/><path d="M7.007 16.993a1 1 0 0 1 .083 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7a1 1 0 0 1 1.414 0z"/><path d="M4 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z"/><path d="M21 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z"/><path d="M6.213 4.81l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 1.217 -1.567l.102 .07z"/><path d="M19.107 4.893a1 1 0 0 1 .083 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7a1 1 0 0 1 1.414 0z"/><path d="M12 2a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z"/><path d="M12 7a5 5 0 1 1 -4.995 5.217l-.005 -.217l.005 -.217a5 5 0 0 1 4.995 -4.783z"/></svg>';
    const MOON_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.992a10 10 0 1 0 9.236 13.838c.341 -.82 -.476 -1.644 -1.298 -1.31a6.5 6.5 0 0 1 -6.864 -10.787l.077 -.08c.551 -.63 .113 -1.653 -.758 -1.653h-.266l-.068 -.006l-.06 -.002z"/></svg>';

    function applyTheme(dark) {
      const body = document.body;
      const nav = document.querySelector('nav');
      const btn = document.getElementById('theme-btn');
      const navName = document.querySelector('.nav-name');
      const navLinks = document.querySelectorAll('.nav-links a');
      const boxes = document.querySelectorAll('[data-box="true"]');

      if (dark) {
        body.style.backgroundColor = '#111827';
        body.style.color = '#d1d5db';
        nav.style.background = '#1f2937';
        nav.style.borderColor = '#374151';
        if (navName) navName.style.color = '#f9fafb';
        navLinks.forEach(el => el.style.color = '#d1d5db');
        boxes.forEach(el => { el.style.background = '#1f2937'; el.style.borderColor = '#374151'; });
        document.querySelectorAll('h1, h2, h2, p').forEach(el => el.style.color = '#d1d5db');
        if (btn) { btn.innerHTML = MOON_ICON; btn.style.color = '#f9fafb'; }
      } else {
        body.style.backgroundColor = '#ffffff';
        body.style.color = '#111827';
        nav.style.background = '#ffffff';
        nav.style.borderColor = '#e5e7eb';
        if (navName) navName.style.color = '#111827';
        navLinks.forEach(el => el.style.color = '#374151');
        boxes.forEach(el => { el.style.background = '#ffffff'; el.style.borderColor = '#e5e7eb'; });
        document.querySelectorAll('h1, h2').forEach(el => el.style.color = '#111827');
        document.querySelectorAll('p').forEach(el => el.style.color = '#374151');
        if (btn) { btn.innerHTML = SUN_ICON; btn.style.color = '#111827'; }
      }
    }

    let isDark = false;
    function toggleTheme() {
      isDark = !isDark;
      applyTheme(isDark);
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    const savedTheme = localStorage.getItem('theme');
    isDark = savedTheme ? savedTheme === 'dark' : prefersDark.matches;
    applyTheme(isDark);
    prefersDark.addEventListener('change', e => {
      if (!localStorage.getItem('theme')) { isDark = e.matches; applyTheme(isDark); }
    });
  </script>
</body>
</html>
